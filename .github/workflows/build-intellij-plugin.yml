# GitHub Actions workflow for testing and packaging the IntelliJ plugin:
# - Validate Gradle Wrapper.
# - Run 'test' and 'verifyPlugin' tasks.
# - Run Qodana inspections.
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'runPluginVerifier' task.
# - Upload the built plugin as an Actions artifact for release assembly.
#
# This workflow does not create or modify GitHub Releases.
#
# The workflow is reusable from CI and can also be manually dispatched.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: tinymist::build::intellij-plugin
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Prepare the environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build plugin
      - name: Build plugin
        run: ./gradlew :intellij:buildPlugin

      # Prepare the plugin archive for release assembly and manual installation
      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/editors/intellij/build/distributions
          FILENAME=$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | head -n 1)
          test -n "$FILENAME"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"

      # Store the plugin archive as an artifact for release assembly
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinymist-intellij-plugin
          path: ${{ github.workspace }}/editors/intellij/build/distributions/${{ steps.artifact.outputs.filename }}

  # Run tests and upload a code coverage report
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # Set up Rust for building the Tinymist executable used by LSP tests
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: x86_64-unknown-linux-gnu
          cache-save-if: false

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Build the language server executable used by IntelliJ LSP integration tests
      - name: Build Tinymist executable
        run: cargo build --bin tinymist --locked

      # Run tests
      - name: Run Tests
        run: ./gradlew :intellij:check
        env:
          TINYMIST_EXECUTABLE: ${{ github.workspace }}/target/debug/tinymist

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-result
          path: ${{ github.workspace }}/editors/intellij/build/reports/tests

      # Upload the Kover report to CodeCov
      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/editors/intellij/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        run: ./gradlew :intellij:verifyPlugin

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/editors/intellij/build/reports/pluginVerifier
